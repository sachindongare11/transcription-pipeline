[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transcriber"
version = "0.1.0"
description = "Audio -> timestamped transcript pipeline (faster-whisper + FastAPI)"
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.1",   # CTranslate2 Whisper; pulls in PyAV (bundled FFmpeg libs)
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
transcribe = "transcriber.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["slow: runs the real Whisper model (downloads weights on first run)"]
addopts = "-m 'not slow'"
